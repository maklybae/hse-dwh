version: 2

models:
  - name: fct_warehouse_delivery_daily
    description: "Daily warehouse delivery mart for a single business date."
    columns:
      - name: shipment_date
        description: "Business date of shipment dispatch (daily grain)."
        tests:
          - not_null
      - name: warehouse_id
        description: "Warehouse identifier (string business key based on warehouse_code)."
        tests:
          - not_null
      - name: warehouse_name
        description: "Warehouse display name."
        tests:
          - not_null
      - name: order_count
        description: "Distinct orders dispatched by warehouse for shipment_date."
      - name: total_shipment_qty
        description: "Total package count shipped by warehouse for shipment_date."
      - name: avg_processing_time_min
        description: "Average minutes between order creation and dispatch."
      - name: delayed_orders_count
        description: "Number of shipments with processing time above configured threshold."
      - name: unique_customers_count
        description: "Distinct customers with shipped orders by warehouse for shipment_date."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - shipment_date
              - warehouse_id
