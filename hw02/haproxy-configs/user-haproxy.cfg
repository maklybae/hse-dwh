global
    maxconn 500

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

listen postgres
    bind *:5432
    option httpchk OPTIONS /master
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server postgresql_pg-user-1_5432 pg-user-1:5432 maxconn 100 check port 8008
    server postgresql_pg-user-2_5432 pg-user-2:5432 maxconn 100 check port 8008
    server postgresql_pg-user-3_5432 pg-user-3:5432 maxconn 100 check port 8008

listen postgres_replicas
    bind *:5332
    balance leastconn
    option httpchk OPTIONS /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server postgresql_pg-user-1_5432 pg-user-1:5432 maxconn 100 check port 8008
    server postgresql_pg-user-2_5432 pg-user-2:5432 maxconn 100 check port 8008
    server postgresql_pg-user-3_5432 pg-user-3:5432 maxconn 100 check port 8008
